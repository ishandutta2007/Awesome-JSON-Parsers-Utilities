<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatLeft {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.25; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.45; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.25; }
      }
      @keyframes floatRight {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(12px) translateX(-8px); opacity: 0.55; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .particle-1 { animation: floatLeft 6s ease-in-out infinite; }
      .particle-2 { animation: floatRight 8s ease-in-out infinite; }
      .glowing-orb { animation: pulseGlow 4s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 8 6; animation: streamFlow 2s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .mono-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs / Glows (strictly background layer) -->
  <circle cx="200" cy="180" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.12" class="glowing-orb" />
  <circle cx="1020" cy="160" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.1" class="glowing-orb" />
  <circle cx="600" cy="300" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.15" class="glowing-orb" />

  <!-- Background Dynamic Flow Lines & Particles -->
  <path d="M 50 280 Q 300 200, 600 290 T 1150 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2" class="data-stream" />
  <path d="M 80 80 Q 400 140, 700 70 T 1120 120" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2" class="data-stream" />

  <!-- Decorative Floating JSON Token Pills in Background -->
  <g class="particle-1">
    <rect x="70" y="50" width="130" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="135" y="71" fill="#38bdf8" font-size="12" text-anchor="middle" class="mono-code">"simdjson": 4GB/s</text>
  </g>

  <g class="particle-2">
    <rect x="990" y="60" width="140" height="32" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <text x="1060" y="81" fill="#c084fc" font-size="12" text-anchor="middle" class="mono-code">{ "serde": 0-cost }</text>
  </g>

  <g class="particle-1">
    <rect x="1000" y="270" width="130" height="32" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <text x="1065" y="291" fill="#34d399" font-size="12" text-anchor="middle" class="mono-code">"yyjson": 100%</text>
  </g>

  <g class="particle-2">
    <rect x="80" y="275" width="125" height="32" rx="16" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4" />
    <text x="142" y="296" fill="#f472b6" font-size="12" text-anchor="middle" class="mono-code">&lt;schema.json&gt;</text>
  </g>

  <!-- Foreground Title and Centerpiece (Ensured in clear foreground above background effects) -->
  <g transform="translate(600, 110)">
    <!-- Decorative Category Tag -->
    <rect x="-160" y="-45" width="320" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="-27" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle" class="subtitle-text" letter-spacing="1.5">⚡ HIGH-PERFORMANCE DATA INTERCHANGE</text>

    <!-- Main Title -->
    <text x="0" y="32" fill="#ffffff" font-size="44" text-anchor="middle" class="title-text">
      Awesome JSON Parsers &amp; Utilities
    </text>

    <!-- Subtitle -->
    <text x="0" y="75" fill="#94a3b8" font-size="18" text-anchor="middle" class="subtitle-text">
      Curated ecosystem of blazing-fast parsers, serializing frameworks &amp; cloud validation platforms
    </text>

    <!-- Tech Stack Pill Highlights in Foreground -->
    <g transform="translate(0, 125)">
      <!-- Pill 1: C/C++ -->
      <rect x="-270" y="-16" width="120" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="-210" y="5" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle" class="subtitle-text">🚀 C / C++</text>

      <!-- Pill 2: Java -->
      <rect x="-135" y="-16" width="120" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="-75" y="5" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle" class="subtitle-text">☕ Java &amp; Go</text>

      <!-- Pill 3: Rust & Python -->
      <rect x="0" y="-16" width="135" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="67" y="5" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle" class="subtitle-text">🦀 Rust &amp; Python</text>

      <!-- Pill 4: SaaS Tools -->
      <rect x="150" y="-16" width="125" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="212" y="5" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle" class="subtitle-text">☁️ Cloud SaaS</text>
    </g>
  </g>
</svg>
